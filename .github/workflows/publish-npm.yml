name: Publish npm package

# Publishes @varity-labs/mcp to npm on a release tag (mcp-v<major>.<minor>.<patch>)
# or on demand. The package's own `prepublishOnly` (build + prepublish guard)
# still runs. Requires the repository secret NPM_TOKEN (npm automation token
# with publish rights on @varity-labs). Without it the job fails closed.

on:
  push:
    tags:
      - "mcp-v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Require main for manual publication
        if: github.event_name == 'workflow_dispatch'
        env:
          SOURCE_REF: ${{ github.ref }}
        shell: bash
        run: |
          if [ "$SOURCE_REF" != "refs/heads/main" ]; then
            echo "::error::manual package publication requires main"
            exit 1
          fi
      - name: Verify the tag matches package.json
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          requested="${GITHUB_REF_NAME#mcp-v}"
          package_version="$(node -p 'require("./package.json").version')"
          if [[ "$requested" != "$package_version" ]]; then
            echo "::error::tag mcp-v${requested} does not match package.json version ${package_version}"
            exit 1
          fi
      - name: Verify release source custody
        run: node scripts/check-release-custody.cjs
      - name: Refuse to publish without a token
        shell: bash
        run: |
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::repository secret NPM_TOKEN is not set; refusing to publish"
            exit 1
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Verify npm publisher access
        run: node scripts/check-publisher-access.cjs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: npm ci --no-audit --no-fund
      - name: Refuse to overwrite a published version
        shell: bash
        run: |
          set -euo pipefail
          name="$(node -p 'require("./package.json").name')"
          version="$(node -p 'require("./package.json").version')"
          if npm view "${name}@${version}" version >/dev/null 2>&1; then
            echo "::error::${name}@${version} is already published"
            exit 1
          fi
      - run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Publish the same version's metadata to the official MCP Registry.
      # Auth is GitHub OIDC (id-token: write above): no extra secret needed.
      # server.json's versions are set from package.json so they cannot drift.
      - name: Sync server.json version with package.json
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p 'require("./package.json").version')"
          jq --arg v "$version" '.version = $v | .packages[0].version = $v' server.json > server.tmp
          mv server.tmp server.json
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Download and verify mcp-publisher
        env:
          MCP_PUBLISHER_VERSION: v1.8.1
        shell: bash
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"
      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc
      - name: Publish server to MCP Registry
        run: ./mcp-publisher publish
