# Repository-local, unprivileged MCP build/test CI.
# It uses only contents: read, holds no repository secrets, and checks out no
# other repository.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.11.0
      - name: Check architecture governance
        run: npm run check:architecture
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Test
        run: npm test

  runtime-version:
    name: runtime-node-${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22.11.0, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install exact dependencies
        run: npm ci --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Execute package entrypoint and verify stdio identity
        run: node --test test/runtime-version.mjs
